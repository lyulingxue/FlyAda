# Ablation: same as train_flyada_partial.yaml but with the velocity-decoding
# auxiliary loss disabled (vel_aux_coeff: 0.0), to get a real nominal-success
# number for the "~7% without the auxiliary loss" claim in the paper text.
run_name: flyada_partial_noaux_v1
env_config: configs/env_partial.yaml
demos_path: results/ppo_teacher_v2/demos.npz
demos_perturbed_path: results/ppo_teacher_v2/demos_perturbed.npz
partial_obs: true

latent_dim: 32
alpha: 0.3
update_mode: ema
adaptation_hidden: 128
z_dropout: 0.0
vel_aux_coeff: 0.0

action_horizon: 8
diffusion_steps_train: 50
diffusion_steps_sample: 20
hidden_dim: 128
lr: 1.0e-4
batch_size: 32
steps_per_epoch: 400
train_max_len: 80
epochs: 25
exec_k: 4
eval_every_epochs: 5
seed: 0
device: cuda

perturb:
  mass_range: [0.9, 1.3]
  drag_range: [0.05, 0.25]
  wind_mag_range: [0.0, 1.0]
  delay_steps: [0, 3]
