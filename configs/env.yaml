# Nominal UAV env parameters. PLAN.md Section 4.
dt: 0.02
max_steps: 400

# Dynamics
mass: 1.0
drag: 0.1
wind: [0.0, 0.0, 0.0]
control_delay: 0      # integer step delay on applied action
action_scale: 5.0     # max acceleration magnitude in m/s^2 per axis (action is in [-1,1])

# Action / state
state_dim: 12
action_dim: 3

# Workspace
pos_bound: 5.0        # half-size of spawn/goal cube in meters
goal_distance_range: [3.0, 7.0]
success_pos_tol: 0.5
success_vel_tol: 1.0

# Obstacles
num_obstacles_range: [0, 2]
obstacle_box_half_range: [0.3, 0.7]   # half-extent per axis
obstacle_cyl_radius_range: [0.3, 0.6]
obstacle_cyl_height_range: [1.0, 2.5]
obstacle_clearance: 0.6               # min distance from start/goal

# Reward
reward:
  dist_coeff: 0.1
  ctrl_coeff: 0.01
  collision_penalty: 1.0
  success_bonus: 100.0
